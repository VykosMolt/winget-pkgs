name: ZeroLaunch manifest validation

on:
  push:
    branches: [ci/zerolaunch-validation-20261009]

permissions:
  contents: read

jobs:
  notification-control:
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Probe notification API without target app
        shell: pwsh
        env:
          TARGET_ARCHITECTURE: arm64
        run: ./.github/scripts/zerolaunch-validation.ps1 -NotificationControl
      - name: Save control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zerolaunch-notification-control
          path: ${{ runner.temp }}/zerolaunch-evidence
  validate:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
          - runner: windows-2025
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            manifests/g/ghost-him/ZeroLaunch-rs/0.5.2
            .github/scripts
      - name: Validate, install, and launch
        shell: pwsh
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/zerolaunch-validation.ps1
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zerolaunch-${{ matrix.runner }}
          path: ${{ runner.temp }}/zerolaunch-evidence

